<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация | MultiWallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface-2:#f5f7f5; --line:#dde3de;
  --ink:#14201c; --muted:#5d6b64; --brand:#0f3d33; --brand-ink:#ffffff; --accent:#bfeacf;
  --danger:#b42318; --radius:18px;
  --usd:#1f7a5c; --eur:#3b5bdb; --rub:#c2410c; --kgs:#b7791f;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1311; --surface:#141d1a; --surface-2:#1a2622; --line:#25332e;
    --ink:#e8efeb; --muted:#93a39b; --brand:#bfeacf; --brand-ink:#0c1311; --accent:#1f4a3d;
    --danger:#ff8a80;
    --usd:#5fd3a2; --eur:#8ea2ff; --rub:#ff9a6b; --kgs:#f0c36a;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--eur);outline-offset:2px}

.shell{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 400px;gap:48px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;margin-bottom:28px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-style:normal;color:var(--brand-ink);font-size:15px}
.intro h1{margin:0 0 14px;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.intro p{margin:0 0 24px;color:var(--muted);max-width:42ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.card h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--muted);opacity:.7}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.pass{position:relative}
.pass .input{padding-right:84px}
.pass button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pass button:hover{color:var(--ink)}
.btn{width:100%;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);margin-top:6px;transition:transform .15s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.alt{margin:20px 0 0;text-align:center;color:var(--muted);font-size:14px}
.alt a{color:var(--ink);font-weight:700;text-underline-offset:3px}
.error{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);font-weight:600;font-size:14px}
.error.show{display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){.shell{grid-template-columns:1fr;gap:28px;max-width:440px}.intro h1{font-size:30px}}
</style>
</head>
<body>

<div class="shell">
  <section class="intro">
    <div class="logo"><i>M</i> MultiWallet</div>
    <h1>Все ваши деньги в одном месте</h1>
    <p>Открывайте счета в разных валютах, переводите деньги и конвертируйте их без лишних шагов.</p>
    <div class="chips">
      <span class="chip" style="--c:var(--usd)">USD</span>
      <span class="chip" style="--c:var(--eur)">EUR</span>
      <span class="chip" style="--c:var(--rub)">RUB</span>
      <span class="chip" style="--c:var(--kgs)">KGS</span>
    </div>
  </section>

  <section class="card">
    <h2>Создайте аккаунт</h2>
    <p class="sub">Это займёт меньше минуты</p>

    <div id="error" class="error" role="alert"></div>

    <form id="userForm">
      <div class="field">
        <label for="name">Имя</label>
        <input type="text" class="input" id="name" placeholder="Иван Иванов" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Электронная почта</label>
        <input type="email" class="input" id="email" placeholder="ivan@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <div class="pass">
          <input type="password" class="input" id="password" placeholder="Введите пароль" autocomplete="new-password" required>
          <button type="button" id="togglePass">Показать</button>
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Зарегистрироваться</button>
    </form>

    <p class="alt">Уже есть аккаунт? <a href="dashboard.html">Открыть личный кабинет</a></p>
  </section>
</div>

<script>
const API_URL = 'http://localhost:8080/api/users';
const $ = id => document.getElementById(id);

function showError(msg) {
  const box = $('error');
  box.textContent = msg;
  box.classList.add('show');
}

$('togglePass').addEventListener('click', () => {
  const input = $('password');
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  $('togglePass').textContent = hidden ? 'Скрыть' : 'Показать';
});

$('userForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('error').classList.remove('show');

  const name = $('name').value;
  const email = $('email').value;
  const password = $('password').value;

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Создаём аккаунт…';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    if (response.ok) {
      const user = await response.json();
      
      localStorage.setItem('currentUserId', user.id);
      window.location.href = 'dashboard.html';
    } else {
      showError('Не удалось создать аккаунт. Проверьте данные: возможно, такая почта уже занята.');
    }
  } catch (error) {
    console.error('Ошибка:', error);
    showError('Нет связи с сервером. Проверьте, что он запущен на localhost:8080.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Зарегистрироваться';
  }
});
</script>
</body>
</html>
